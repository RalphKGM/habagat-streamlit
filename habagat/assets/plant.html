<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,650;1,9..144,500&family=Instrument+Sans:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --paper:#F2EDE3; --paper2:#E8E0CF; --rule:#D3C8B2; --ink:#16232A; --soft:#4E5D63; --sun:#E59A2B;
    --sun-deep:#C9731B; --sea:#2D6A8A; --leaf:#1F5E57; --ember:#C4513A; --violet:#6C5BA7; --stone:#A79F90; }
  * { box-sizing:border-box; }
  html, body { margin:0; background:transparent; font-family:'Instrument Sans', sans-serif; color:var(--ink); }
  .wrap { border:1px solid var(--ink); border-radius:18px; overflow:hidden; background:var(--paper); }
  .stage { position:relative; }
  svg.scene { display:block; width:100%; height:520px; }
  .hud { position:absolute; top:14px; left:16px; right:16px; display:flex; justify-content:space-between; align-items:flex-start; gap:12px; pointer-events:none; }
  .clock { background:rgba(242,237,227,.86); backdrop-filter:blur(6px); border:1px solid var(--ink); border-radius:12px; padding:10px 14px 9px; min-width:190px; }
  .clock .t { font-family:'JetBrains Mono', monospace; font-size:34px; font-weight:600; letter-spacing:-.02em; line-height:1; }
  .clock .d { font-family:'JetBrains Mono', monospace; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--soft); margin-top:6px; }
  .read { background:rgba(242,237,227,.86); backdrop-filter:blur(6px); border:1px solid var(--ink); border-radius:12px; padding:8px 12px; display:grid; grid-template-columns:auto auto; column-gap:16px; row-gap:2px; font-family:'JetBrains Mono', monospace; font-size:12px; }
  .read span { color:var(--soft); display:flex; align-items:center; gap:6px; }
  .read span i { width:8px; height:8px; border-radius:2px; display:inline-block; }
  .read b { text-align:right; font-weight:600; font-variant-numeric:tabular-nums; }
  .bar { display:flex; align-items:center; gap:14px; padding:10px 14px 12px; border-top:1px solid var(--ink); background:var(--paper); }
  button { font-family:'JetBrains Mono', monospace; font-size:12px; letter-spacing:.06em; text-transform:uppercase; border:1px solid var(--ink); background:var(--ink); color:var(--paper); border-radius:999px; padding:7px 14px; cursor:pointer; }
  button.ghost { background:transparent; color:var(--ink); }
  button.on { background:var(--sun); border-color:var(--sun-deep); color:var(--ink); }
  .timeline { flex:1; position:relative; height:46px; cursor:pointer; }
  .timeline svg { width:100%; height:46px; display:block; }
  .legend { font-family:'JetBrains Mono', monospace; font-size:10px; color:var(--soft); letter-spacing:.06em; text-transform:uppercase; white-space:nowrap; }
  .turbine-rotor { will-change:transform; }
  @media (max-width: 700px) { svg.scene { height:auto; } .read { display:none; } .clock .t { font-size:24px; } .legend { display:none; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="stage">
    <svg class="scene" viewBox="0 0 1200 560" preserveAspectRatio="xMidYMax slice" id="scene">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop id="sky0" offset="0"/><stop id="sky1" offset=".75"/><stop id="sky2" offset="1"/>
        </linearGradient>
        <radialGradient id="sunGlow"><stop offset="0" stop-color="#F6B347" stop-opacity=".7"/><stop offset="1" stop-color="#F6B347" stop-opacity="0"/></radialGradient>
        <linearGradient id="panelShine" x1="0" x2="1"><stop offset="0" stop-color="#FFE8B5" stop-opacity="0"/><stop offset=".5" stop-color="#FFE8B5" stop-opacity=".9"/><stop offset="1" stop-color="#FFE8B5" stop-opacity="0"/></linearGradient>
        <clipPath id="panelClip"></clipPath>
      </defs>
      <rect width="1200" height="420" fill="url(#sky)"/>
      <g id="stars"></g>
      <g id="sunG"><circle r="90" fill="url(#sunGlow)"/><circle r="34" fill="#E59A2B" stroke="#C9731B" stroke-width="1.5"/></g>
      <g id="moonG"><circle r="22" fill="#F2EDE3"/><circle r="22" cx="9" cy="-5" fill="#24314A" id="moonShade"/></g>
      <g id="clouds"></g>
      <g id="streaks" fill="none" stroke-linecap="round"></g>
      <path d="M0,404 L120,372 L230,386 L340,356 L470,380 L600,362 L720,384 L850,360 L990,382 L1100,366 L1200,378 L1200,420 L0,420Z" fill="#D9CAAB" id="ridge"/>
      <rect y="418" width="1200" height="142" fill="#E3D6BB" id="ground"/>
      <line x1="0" x2="1200" y1="418" y2="418" stroke="#16232A" stroke-width="1.2"/>

      <!-- solar array -->
      <g id="panels"></g>
      <g clip-path="url(#panelClip)"><rect id="shine" x="0" y="380" width="120" height="80" fill="url(#panelShine)"/></g>

      <!-- wind turbine -->
      <polygon points="452,430 468,430 462,170 458,170" fill="#16232A"/>
      <g transform="translate(460 166)"><g id="rotor" class="turbine-rotor" fill="#16232A"></g><circle r="7" fill="#16232A"/></g>

      <!-- battery -->
      <g transform="translate(724 334)">
        <rect x="18" y="-8" width="24" height="10" rx="2" fill="#16232A"/>
        <rect width="60" height="100" rx="8" fill="#F2EDE3" stroke="#16232A" stroke-width="2"/>
        <clipPath id="battClip"><rect x="4" y="4" width="52" height="92" rx="5"/></clipPath>
        <rect id="battFill" x="4" y="96" width="52" height="0" fill="#6C5BA7" clip-path="url(#battClip)"/>
        <text id="battPct" x="30" y="58" text-anchor="middle" font-family="JetBrains Mono" font-size="15" font-weight="600" fill="#16232A">0%</text>
        <path id="battArrow" d="M30,-26 l-8,10 h16z" fill="#6C5BA7"/>
      </g>

      <!-- town -->
      <g id="town" transform="translate(880 0)"></g>

      <!-- grid pylon -->
      <g transform="translate(1135 0)" stroke="#16232A" stroke-width="2" fill="none">
        <path d="M-22,430 L-6,250 L6,250 L22,430 M-14,340 L14,340 M-10,300 L10,300 M-17,385 L17,385 M-30,262 L30,262 M-24,282 L24,282 M-6,250 L0,232 L6,250"/>
        <path d="M-30,262 Q-120,300 -210,262" stroke-width="1" opacity=".55"/>
      </g>

      <!-- flow network -->
      <g id="wires" fill="none" stroke="#B9AC90" stroke-width="2"></g>
      <g id="flows" fill="none" stroke-linecap="round"></g>
      <g font-family="JetBrains Mono" font-size="11" fill="#4E5D63" letter-spacing=".08em">
        <text x="190" y="548" text-anchor="middle">SOLAR</text>
        <text x="460" y="548" text-anchor="middle">WIND</text>
        <text x="600" y="548" text-anchor="middle">BUS</text>
        <text x="754" y="548" text-anchor="middle">BATTERY</text>
        <text x="975" y="548" text-anchor="middle">DEMAND</text>
        <text x="1135" y="548" text-anchor="middle">GRID</text>
      </g>
      <circle cx="600" cy="486" r="11" fill="#16232A"/><circle cx="600" cy="486" r="4" fill="#E59A2B" id="busDot"/>
    </svg>
    <div class="hud">
      <div class="clock"><div class="t" id="clock">00:00</div><div class="d" id="date"></div></div>
      <div class="read" id="read"></div>
    </div>
  </div>
  <div class="bar">
    <button id="play">Pause</button>
    <button class="ghost" id="speed">1×</button>
    <div class="timeline" id="timeline"><svg viewBox="0 0 960 46" preserveAspectRatio="none" id="tl"></svg></div>
    <div class="legend">■ solar ■ wind ┃ demand</div>
  </div>
</div>
<script>
const D = __DATA__;
const H = D.hours;
const NS = "http://www.w3.org/2000/svg";
const $ = (id) => document.getElementById(id);
const el = (tag, attrs, parent) => { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); if (parent) parent.appendChild(n); return n; };
const lerp = (a, b, f) => a + (b - a) * f;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));

// ---------- static scene ----------
const panels = $("panels"), clip = $("panelClip");
[[392, 38, 18, 8, 7, 66], [414, 42, 20, 9, 7, 52], [438, 46, 22, 10, 6, 40]].forEach(([y, w, h, s, n, x0]) => {
  for (let i = 0; i < n; i++) {
    const x = x0 + i * (w + 6), pts = `${x+s},${y} ${x+w+s},${y} ${x+w},${y+h} ${x},${y+h}`;
    el("polygon", { points: pts, fill: "#24404D", stroke: "#F2EDE3", "stroke-width": 1 }, panels);
    el("polygon", { points: pts }, clip);
  }
});
for (let i = 0; i < 3; i++) {
  el("path", { d: "M0,0 C9,-30 7,-96 0,-118 C-4,-96 -7,-30 0,0Z", transform: `rotate(${i*120})` }, $("rotor"));
}
const stars = $("stars");
for (let i = 0; i < 46; i++) el("circle", { cx: (i * 263) % 1200, cy: (i * 97) % 330 + 8, r: (i % 3) * .5 + .7, fill: "#F2EDE3" }, stars);

const cloudShapes = [];
[[140, 92, 1], [520, 60, .8], [860, 120, 1.15], [1120, 70, .7]].forEach(([x, y, s]) => {
  const g = el("g", {}, $("clouds"));
  [[0,0,34],[30,-12,28],[58,2,30],[24,10,30]].forEach(([cx, cy, r]) => el("circle", { cx: cx*s, cy: cy*s, r: r*s, fill: "#F7F3EA" }, g));
  cloudShapes.push({ g, x, y, s });
});

const streakEls = [];
for (let i = 0; i < 9; i++) {
  const y = 70 + i * 34, p = el("path", { d: `M-200,${y} c140,-14 260,14 420,0`, stroke: "#2D6A8A", "stroke-width": 1.6, "stroke-dasharray": "70 520" }, $("streaks"));
  streakEls.push({ p, off: i * 97 });
}

const town = $("town");
const buildings = [[0, 70, 92], [62, 54, 132], [124, 64, 76], [196, 44, 110]];
const windows = [];
buildings.forEach(([x, w, h]) => {
  el("rect", { x, y: 430 - h, width: w, height: h, fill: "#F2EDE3", stroke: "#16232A", "stroke-width": 1.6 }, town);
  for (let r = 0; r < Math.floor((h - 16) / 18); r++) for (let c = 0; c < Math.floor((w - 10) / 16); c++) {
    windows.push(el("rect", { x: x + 8 + c * 16, y: 430 - h + 10 + r * 18, width: 8, height: 10, fill: "#E59A2B", opacity: 0 }, town));
  }
});

// wires & flow paths: [key, d, colour]
const ROUTES = [
  ["solar",     "M190,452 C260,486 480,486 589,486", "#E59A2B"],
  ["wind",      "M460,430 C470,470 540,486 589,486", "#2D6A8A"],
  ["direct",    "M611,486 C760,486 860,486 975,436", "#1F5E57"],
  ["charge",    "M611,486 C660,486 700,470 724,420", "#6C5BA7"],
  ["discharge", "M784,420 C830,470 900,470 975,436", "#6C5BA7"],
  ["grid",      "M1113,262 C1080,330 1060,420 1076,434", "#C4513A"],
  ["spill",     "M600,497 C600,515 600,522 600,530", "#A79F90"],
];
const flows = {};
ROUTES.forEach(([k, d, c]) => {
  el("path", { d }, $("wires"));
  flows[k] = { p: el("path", { d, stroke: c, "stroke-dasharray": "0.1 15" }, $("flows")), off: 0 };
});

// ---------- timeline ----------
const tl = $("tl"), maxGen = Math.max(...H.map(h => h.solar + h.wind), ...H.map(h => h.demand), 0.01);
H.forEach((h, i) => {
  const x = i * 40 + 3, s = h.solar / maxGen * 38, w = h.wind / maxGen * 38;
  el("rect", { x, y: 44 - s, width: 34, height: s, fill: "#E59A2B" }, tl);
  el("rect", { x, y: 44 - s - w, width: 34, height: w, fill: "#2D6A8A" }, tl);
  el("rect", { x, y: 44 - h.demand / maxGen * 38 - 1, width: 34, height: 2, fill: "#16232A" }, tl);
});
const playhead = el("rect", { x: 0, y: 0, width: 2, height: 46, fill: "#C4513A" }, tl);
$("timeline").addEventListener("click", (e) => {
  const r = e.currentTarget.getBoundingClientRect(); t = clamp((e.clientX - r.left) / r.width * 24, 0, 23.99);
});

// ---------- dynamics ----------
const SKY = [ // hour, top, mid, bottom
  [0, "#1C2238", "#2B3550", "#3A4560"], [4.5, "#222B47", "#3A4560", "#59607A"],
  [6, "#E9A87A", "#F2CD9C", "#F5E2C2"], [8, "#BFD8DC", "#EFE5CF", "#F3EAD8"],
  [12, "#A9CCD8", "#EAE6D6", "#F2EDE3"], [16.5, "#C9D4CF", "#F1DFB8", "#F3E6CB"],
  [18, "#E58C5A", "#EDB57F", "#F2CFA0"], [19.5, "#3B3858", "#5B5070", "#6E6278"], [24, "#1C2238", "#2B3550", "#3A4560"],
];
const hex = (c) => [1, 3, 5].map(i => parseInt(c.substr(i, 2), 16));
const mix = (a, b, f) => "rgb(" + hex(a).map((v, i) => Math.round(lerp(v, hex(b)[i], f))).join(",") + ")";
function sky(h) {
  let i = 0; while (i < SKY.length - 2 && SKY[i + 1][0] <= h) i++;
  const [h0, ...a] = SKY[i], [h1, ...b] = SKY[i + 1], f = clamp((h - h0) / (h1 - h0), 0, 1);
  ["sky0", "sky1", "sky2"].forEach((id, k) => $(id).setAttribute("stop-color", mix(a[k], b[k], f)));
}
const nightness = (h) => clamp(h < 12 ? (6 - h) / 1.5 : (h - 18.3) / 1.5, 0, 1);

function sample(t) {
  const i = Math.floor(t), f = t - i, a = H[i], b = H[Math.min(i + 1, 23)], o = {};
  for (const k in a) o[k] = typeof a[k] === "number" ? lerp(a[k], b[k], f) : a[k];
  return o;
}
function fmt(v, d = 2) { return v.toFixed(d); }

let t = D.startHour || 0, playing = true, speeds = [0.5, 1, 2], si = 1, last = performance.now(), rotorAngle = 0, cloudDrift = 0, visible = true;
$("play").onclick = () => { playing = !playing; $("play").textContent = playing ? "Pause" : "Play"; $("play").classList.toggle("on", !playing); };
$("speed").onclick = () => { si = (si + 1) % speeds.length; $("speed").textContent = ["½×", "1×", "2×"][si]; };
new IntersectionObserver((e) => { visible = e[0].isIntersecting; }).observe(document.body);
$("date").textContent = D.label;

function frame(now) {
  const dt = Math.min((now - last) / 1000, .1); last = now;
  if (!visible) { requestAnimationFrame(frame); return; }
  if (playing) t = (t + dt * speeds[si]) % 24;
  const s = sample(t), cur = H[Math.floor(t)], night = nightness(t);

  sky(t);
  stars.setAttribute("opacity", night);
  // sun & moon on an arc between 06:00 and 18:00
  const ang = Math.PI * (t - 6) / 12;
  const sx = 600 - 520 * Math.cos(ang), sy = 400 - 330 * Math.sin(ang);
  $("sunG").setAttribute("transform", `translate(${sx} ${sy})`);
  $("sunG").setAttribute("opacity", clamp(Math.sin(ang) * 3, 0, 1));
  const mang = Math.PI * (((t + 12) % 24) - 6) / 12;
  $("moonG").setAttribute("transform", `translate(${600 - 520 * Math.cos(mang)} ${400 - 330 * Math.sin(mang)})`);
  $("moonG").setAttribute("opacity", night);
  $("moonShade").setAttribute("fill", mix("#1C2238", "#24314A", .5));
  $("ridge").setAttribute("fill", mix("#D9CAAB", "#5E5F6E", night * .8));
  $("ground").setAttribute("fill", mix("#E3D6BB", "#8C8A8E", night * .7));

  // clouds follow NASA POWER cloud amount
  cloudDrift += dt * (6 + s.hub * 2.2);
  cloudShapes.forEach((c, i) => {
    const x = ((c.x + cloudDrift * (0.6 + i * .15)) % 1450) - 150;
    c.g.setAttribute("transform", `translate(${x} ${c.y})`);
    c.g.setAttribute("opacity", clamp(s.cloud / 100 * (1.1 - i * .12), 0, .95) * (1 - night * .55));
  });

  // turbine: rotor speed tracks simulated wind output; idles below cut-in
  const windFrac = D.windCap > 0 ? s.wind / D.windCap : 0;
  const omega = windFrac > 0.002 ? 50 + 330 * windFrac : 5 + s.hub * 2;
  rotorAngle = (rotorAngle + omega * dt) % 360;
  $("rotor").setAttribute("transform", `rotate(${rotorAngle})`);
  streakEls.forEach((k, i) => {
    k.off = (k.off + dt * (12 + s.hub * 26) * (1 + (i % 3) * .2)) % 1800;
    k.p.setAttribute("transform", `translate(${k.off - 200} 0)`);
    k.p.setAttribute("opacity", clamp(s.hub / 12, .08, .7));
  });

  // solar glint scales with PV output
  const solarFrac = D.solarCap > 0 ? s.solar / D.solarCap : 0;
  const shine = $("shine");
  shine.setAttribute("x", ((now / 9) % 520) - 100);
  shine.setAttribute("opacity", clamp(solarFrac * 1.4, 0, 1));

  // battery
  const soc = D.battCap > 0 ? s.soc / D.battCap : 0, fillH = 92 * soc;
  $("battFill").setAttribute("y", 96 - fillH); $("battFill").setAttribute("height", fillH);
  $("battPct").textContent = D.battCap > 0 ? Math.round(soc * 100) + "%" : "—";
  const arrow = $("battArrow");
  arrow.setAttribute("opacity", (s.charge > .01 || s.discharge > .01) ? 1 : 0);
  arrow.setAttribute("transform", s.charge >= s.discharge ? "" : "rotate(180 30 -21)");

  // town lights: brighter at night and with higher demand
  const glow = clamp(s.demand / (D.peakDemand || 0.65), 0, 1) * (0.25 + night * .75);
  windows.forEach((w, i) => w.setAttribute("opacity", ((i * 37) % 10) / 10 < glow ? .9 : .08));

  // flows: particle speed and width follow MW
  const amounts = { solar: s.solar, wind: s.wind, direct: s.direct, charge: s.charge, discharge: s.discharge, grid: s.grid, spill: s.spill };
  const ref = Math.max(D.solarCap + D.windCap, 1);
  for (const k in flows) {
    const v = amounts[k], f = flows[k];
    f.off = (f.off - dt * (20 + 110 * v / ref)) % 1000;
    f.p.setAttribute("stroke-dashoffset", f.off);
    f.p.setAttribute("stroke-width", v > 0.004 ? 3 + 11 * Math.sqrt(v / ref) : 0);
    f.p.setAttribute("opacity", v > 0.004 ? 1 : 0);
  }
  $("busDot").setAttribute("r", 3 + 4 * clamp((s.solar + s.wind) / ref, 0, 1));

  const hh = Math.floor(t), mm = Math.floor((t - hh) * 60);
  $("clock").textContent = String(hh).padStart(2, "0") + ":" + String(mm).padStart(2, "0");
  $("read").innerHTML =
    `<span><i style="background:#E59A2B"></i>Solar</span><b>${fmt(cur.solar)} MW</b>` +
    `<span><i style="background:#2D6A8A"></i>Wind · ${fmt(cur.hub, 1)} m/s</span><b>${fmt(cur.wind)} MW</b>` +
    `<span><i style="background:#16232A"></i>Demand</span><b>${fmt(cur.demand)} MW</b>` +
    `<span><i style="background:#6C5BA7"></i>Battery</span><b>${fmt(cur.soc)} MWh</b>` +
    `<span><i style="background:#C4513A"></i>From grid</span><b>${fmt(cur.grid)} MWh</b>` +
    `<span><i style="background:#A79F90"></i>Unused</span><b>${fmt(cur.spill)} MWh</b>`;
  playhead.setAttribute("x", t / 24 * 960 - 1);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>

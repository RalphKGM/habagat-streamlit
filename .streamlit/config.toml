[theme]
base = "dark"
primaryColor = "#FFD166"
backgroundColor = "#0C1E2B"
secondaryBackgroundColor = "#0F2433"
textColor = "#EAF2F6"
linkColor = "#FFD166"
borderColor = "#1F3A4D"
font = "Barlow:https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&display=swap, sans-serif"
headingFont = "Barlow Condensed:https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&display=swap, sans-serif"
codeFont = "IBM Plex Mono:https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap, monospace"
headingFontWeights = [600, 600, 600, 500, 500, 500]
headingFontSizes = ["2.1rem", "1.6rem", "1.25rem", "1.1rem", "1rem", "0.95rem"]
baseFontSize = 15
baseRadius = "2px"
showWidgetBorder = true
chartCategoricalColors = ["#FF8A5B", "#3FD0F0", "#6EE7B7", "#FF5C7A", "#C3A6FF", "#FFD166"]

[client]
toolbarMode = "minimal"
showErrorDetails = "type"

[server]
headless = true

[browser]
gatherUsageStats = false

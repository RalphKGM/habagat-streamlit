[theme]
base = "light"
primaryColor = "#15191C"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F5F3"
textColor = "#15191C"
linkColor = "#2F6FDE"
borderColor = "#E1E4E0"
font = "Archivo:https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap, sans-serif"
headingFont = "Archivo:https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap, sans-serif"
codeFont = "JetBrains Mono:https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap, monospace"
headingFontWeights = [700, 700, 600, 600, 600, 600]
headingFontSizes = ["1.9rem", "1.45rem", "1.15rem", "1rem", "0.95rem", "0.9rem"]
baseFontSize = 15
baseRadius = "2px"
showWidgetBorder = true
chartCategoricalColors = ["#E8A317", "#2F6FDE", "#3BA272", "#D64545", "#7C5CDB", "#15191C"]

[client]
toolbarMode = "minimal"
showErrorDetails = "type"

[server]
headless = true

[browser]
gatherUsageStats = false
